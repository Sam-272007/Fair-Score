services:
  - type: web
    name: fairscore
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm --prefix client install --include=dev && npm --prefix server install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
